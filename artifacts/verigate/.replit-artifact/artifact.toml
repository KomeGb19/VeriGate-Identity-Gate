kind = "web"
previewPath = "/"
title = "VeriGate Identity Gate"
description = "A tablet-friendly identity verification app for school pickups and residential estate gates, with biometric enrolment, live verification decisions, and an auditable event log."
version = "1.0.0"
id = "artifacts/verigate"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25870

[services.development]
run = "pnpm --filter @workspace/verigate run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/verigate", "run", "build" ]
serve = "static"
publicDir = "artifacts/verigate/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25870"
BASE_PATH = "/"
